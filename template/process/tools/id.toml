# Model śledzalności (szablon D-06) i jedyne źródło schematów ID (szablon D-05).
# Warstwa maszynowa po angielsku (szablon D-17, szablon D-18): kody, pola, stany, klucze; komentarze i treść po polsku.
# Czytają go narzędzia z process/tools/ (model.py, trace.py, progress.py, iso_map.py, check_commit.py);
# ścieżki plików są względem katalogu głównego projektu. AGENTS.md procesu tylko tu odsyła.
#
# Klucze typu:
#   code, name       krótki kod i nazwa rodzaju elementu (nazwa po polsku, dla ludzi)
#   pattern          wyrażenie regularne pełnego ID (podwójny backslash: "\\d")
#   file             ścieżka lub glob pliku, w którym elementy są definiowane;
#                    gdy plik nie istnieje, typ jest nieaktywny (np. moduł niewdrożony)
#   format           markdown (domyślnie: nagłówek "### ID Tytuł" + linie "- pole: wartość"),
#                    feature (tag "@ID" + komentarze "# pole: wartość"),
#                    mermaid (komentarze "%% ID pole: wartość")
#   root             true = element nie musi mieć rodzica
#   root_if          "pole=wartość": element nie musi mieć rodzica tylko wtedy (np. VER z subject=repository, szablon D-35)
#   fields           pola, w których element wskazuje rodziców (P-03: dziecko podaje rodzica)
#   parents          dozwolone kody typów rodziców
#   parent_rules     opcjonalnie, gdy typ ma kilka pól rodzica: "pole: KOD|KOD [pole_rodzica=wartość]";
#                    pole może wskazywać tylko te typy, a rodzic musi spełniać warunek (szablon D-28)
#   required         pola, które muszą być niepuste
#   optional         pozostałe dozwolone pola; pole spoza fields, required, optional i
#                    [project] common_fields daje ostrzeżenie W4 (szablon D-21)
#   statuses         dozwolone wartości pola status
#   coverage         "KOD:poziom,..." oczekiwane dzieci danego typu; poziom: error | warning;
#                    KOD "*" = dowolne dziecko albo wzmianka w commicie
#   coverage_if      "pole=wartość": pokrycie sprawdzane tylko dla takich elementów
#   ears             true = sprawdzaj składnię EARS (wzorzec, jedno "shall") i pojęcia ze słownika
#   terms            true = nawias na końcu tytułu podaje angielską nazwę pojęcia ("Element (Item)")
#   product          true = produkt pracy: status obowiązkowy (szablon D-14), wartości z [project] product_states (szablon D-11)
#   produces         true = pole produces: wskazuje w dół kody typów lub ID (szablon D-09, jawny wyjątek od P-03)
#   results          dozwolone wartości pola result (rekordy)
#   iso              produkt pracy ISO/IEC 29110-5-1-2, któremu odpowiada typ (szablon D-12)
#   qualities        dozwolone wartości pola quality (charakterystyki jakości z WP.13, szablon D-33); trace.md
#                    pokazuje, które charakterystyki nie mają jeszcze żadnego wymagania
#   area_prefix      true = przedrostek ID to obszar (np. CAP); w tekście ciągłym nieznane ID tego typu
#                    jest błędem E2 tylko wtedy, gdy jego obszar już występuje (np. „UTF-16” nie jest błędem)

[project]
# Ustawienia projektu (system, ocena zgodności, migrated_to) są w project/settings.toml projektu (szablon D-55);
# narzędzia łączą je z tymi regułami. Tu zostają reguły wspólne dla wszystkich projektów.
# szablon D-11: stany produktów pracy wprost z ISO/IEC 29110-5-1-2, tabela 12 (initiated, verified, approved).
# Baseline nie jest stanem: wynika z tagów baseline-nn.
product_states = ["initiated", "verified", "approved"]
# Pola dozwolone w każdym typie (szablon D-21).
common_fields = ["notes"]

[fields]
status = "status"
result = "result"
produces = "produces"
text = "text"
pattern = "pattern"
tag = "tag"
due = "due"
completed = "completed"
objective = "objective"
milestone = "milestone"
cause = "cause"
action = "action"
mitigation = "mitigation"
concerns = "concerns"
quality = "quality"
checklist = "checklist"
failed = "failed"
runner = "runner"

[[type]]
code = "SC"
name = "Scenka użytkownika"
pattern = "SC-\\d{2}"
file = "spec/scenarios.md"
root = true
coverage = "UC:warning"
product = true
iso = "WP.02"
optional = ["person", "interests", "content"]

[[type]]
code = "IO"
name = "Pozycja zakresu In/Out"
pattern = "IO-\\d{2}"
file = "spec/scope.md"
root = true
required = ["kind"]
coverage = "UC:warning"
coverage_if = "kind=In"
product = true
iso = "WP.02"
optional = ["rationale", "release"]

[[type]]
code = "D"
name = "Decyzja"
pattern = "D-\\d{2}"
file = "project/decisions.md"
root = true
required = ["status"]
statuses = ["open", "resolved", "deferred"]
coverage = "*:warning"
coverage_if = "status=resolved"
iso = "WP.03, WP.07"
optional = ["options", "proposal", "choice", "date"]

[[type]]
code = "Q"
name = "Temat w kolejce"
pattern = "Q-\\d{2}"
file = "project/decisions.md"
root = true

[[type]]
code = "DP"
name = "Zasada projektowa"
pattern = "DP-\\d{2}"
file = "spec/principles.md"
fields = ["established_by"]
parents = ["D"]
coverage = "REQ:warning"
product = true
optional = ["content", "exceptions"]

[[type]]
code = "G"
name = "Pojęcie słownika"
pattern = "G-[A-Z]{3}-\\d{2}"
file = "spec/glossary.md"
root = true
fields = ["changed_by"]
parents = ["D"]
terms = true
product = true
iso = "WP.13"
optional = ["definition", "distinct_from"]

[[type]]
code = "UC"
name = "Przypadek użycia"
pattern = "UC-\\d{2}"
file = "spec/use-cases.md"
fields = ["scenarios", "scope"]
parents = ["SC", "IO"]
parent_rules = ["scenarios: SC", "scope: IO kind=In"]
coverage = "REQ:warning,E:warning"
product = true
iso = "WP.13"
optional = ["level", "primary_actor", "form", "minimal_guarantee", "success_guarantee"]

[[type]]
code = "RSK"
name = "Ryzyko produktu"
pattern = "RSK-\\d{2}"
file = "spec/risks.md"
fields = ["source"]
parents = ["UC"]
coverage = "REQ:error"
product = true
optional = ["impact", "likelihood", "severity"]

[[type]]
code = "REQ"
name = "Wymaganie EARS"
pattern = "(?<![A-Z-])(?!(?:RSK|PRK|OBJ|TSK|COR|VER|VAL|ACC)-)[A-Z]{3}-\\d{2}"
file = "spec/requirements.md"
fields = ["source"]
parents = ["UC", "D", "DP", "RSK", "IO"]
required = ["pattern", "text"]
coverage = "AT:warning"
ears = true
product = true
area_prefix = true
iso = "WP.13"
optional = ["quality"]
qualities = ["functional", "performance", "compatibility", "usability", "reliability", "security", "maintainability", "portability", "constraint", "legal"]

[[type]]
code = "E"
name = "Ekran"
pattern = "E-\\d{2}"
file = "spec/navigation/screens.mmd"
format = "mermaid"
fields = ["realizes"]
parents = ["UC"]
product = true
iso = "WP.16"

[[type]]
code = "AT"
name = "Test akceptacyjny"
pattern = "AT-\\d{2}"
file = "spec/tests/*.feature"
format = "feature"
fields = ["verifies"]
parents = ["REQ"]
product = true
iso = "WP.19"
optional = ["runner"]    # szablon D-60: plik::przypadek testu automatycznego, np. tools/test_tools.py::chain

# ---------- Plan (szablon D-08, szablon D-09): plan.md, ISO/IEC 29110 WP.10

[[type]]
code = "OBJ"
name = "Cel projektu"
pattern = "OBJ-\\d{2}"
file = "project/plan.md"
root = true
coverage = "MS:warning"
iso = "WP.10"
optional = ["measure"]

[[type]]
code = "MS"
name = "Kamień milowy"
pattern = "MS-\\d{2}"
file = "project/plan.md"
fields = ["objective"]
parents = ["OBJ"]
required = ["due"]
coverage = "TSK:warning"
iso = "WP.10"
optional = ["tag", "acceptance_criteria"]

[[type]]
code = "TSK"
name = "Zadanie"
pattern = "TSK-\\d{2}"
file = "project/plan.md"
fields = ["milestone"]
parents = ["MS"]
required = ["status", "produces"]
statuses = ["planned", "in_progress", "completed"]
produces = true
iso = "WP.10"
optional = ["due", "completed", "deviation", "acceptance_criteria"]   # szablon D-71: kryteria odbioru zadania

[[type]]
code = "PRK"
name = "Ryzyko projektu"
pattern = "PRK-\\d{2}"
file = "project/plan.md"
root = true
fields = ["concerns"]
parents = ["OBJ", "MS", "TSK"]
required = ["status", "mitigation"]
statuses = ["open", "closed"]
iso = "WP.10"

# ---------- Rekordy (szablon D-12, szablon D-16): po jednym pliku na produkt normy

[[type]]
code = "COR"
name = "Korekta"
pattern = "COR-\\d{2}"
file = "records/corrections.md"
fields = ["cause"]
parents = ["TSK", "MS", "PRK", "VER", "VAL", "ACC"]
required = ["status", "action"]
statuses = ["initiated", "approved", "completed"]
iso = "WP.04"
optional = ["by", "opened", "due"]

[[type]]
code = "VER"
name = "Weryfikacja"
pattern = "VER-\\d{2}"
file = "records/verification.md"
fields = ["items"]
parents = ["SC", "IO", "DP", "G", "UC", "RSK", "REQ", "E", "AT", "OBJ", "MS", "TSK"]
required = ["date", "result"]
results = ["pass", "fail"]
coverage = "COR:warning"
coverage_if = "result=fail"
iso = "WP.23"
optional = ["by", "checklist", "failed", "subject"]
root_if = "subject=repository"

[[type]]
code = "VAL"
name = "Walidacja"
pattern = "VAL-\\d{2}"
file = "records/validation.md"
fields = ["items"]
parents = ["SC", "UC", "REQ", "E", "AT"]
required = ["date", "result"]
results = ["pass", "fail"]
coverage = "COR:warning"
coverage_if = "result=fail"
iso = "WP.22"
optional = ["by", "checklist", "failed"]

[[type]]
code = "ACC"
name = "Akceptacja"
pattern = "ACC-\\d{2}"
file = "records/acceptance.md"
fields = ["milestone"]
parents = ["MS"]
required = ["date", "result"]
results = ["accepted", "rejected"]
coverage = "COR:warning"
coverage_if = "result=rejected"
iso = "WP.01"
optional = ["by", "open_issues"]