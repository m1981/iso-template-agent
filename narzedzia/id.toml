# Model śledzalności (D-06) i jedyne źródło schematów ID (D-05).
# Czytają go narzedzia/model.py, slad.py i sprawdz_commit.py; AGENTS.md tylko tu odsyła.
#
# Pola typu:
#   kod, nazwa       krótki kod i nazwa rodzaju elementu
#   wzorzec          wyrażenie regularne pełnego ID (podwójny backslash: "\\d")
#   plik             ścieżka lub glob pliku, w którym elementy są definiowane;
#                    gdy plik nie istnieje, typ jest nieaktywny (np. moduł niewdrożony)
#   format           markdown (domyślnie: nagłówek "### ID Tytuł" + linie "- pole: wartość"),
#                    feature (tag "@ID" + komentarze "# pole: wartość"),
#                    mermaid (komentarze "%% ID pole: wartość")
#   korzen           true = element nie musi mieć rodzica
#   pola             pola, w których element wskazuje rodziców (P-03: dziecko podaje rodzica)
#   rodzice          dozwolone kody typów rodziców
#   wymagane_pola    pola, które muszą być niepuste
#   statusy          dozwolone wartości pola "status"
#   pokrycie         "KOD:poziom,..." oczekiwane dzieci danego typu; poziom: blad | ostrzezenie;
#                    KOD "*" = dowolne dziecko albo wzmianka w commicie
#   warunek_pokrycia "pole=wartość" pokrycie sprawdzane tylko dla takich elementów
#   ears             true = sprawdzaj składnię EARS (wzorzec, jedno "shall") i pojęcia ze słownika
#   pojecia          true = nawias na końcu tytułu podaje angielską nazwę pojęcia ("Element (Item)")
#   produkt          true = produkt pracy: pole "status" przyjmuje stany z [projekt] stany_produktow (D-11)
#   produkuje        true = pole "produkuje:" wskazuje w dół kody typów lub ID (D-09, jawny wyjątek od P-03)
#   wyniki           dozwolone wartości pola "wynik" (rekordy)
#   iso              produkt pracy ISO/IEC 29110-5-1-2, któremu odpowiada typ (D-12)

[projekt]
system = "System"      # podmiot wymagań EARS; zmień na nazwę swojego systemu
# D-11: jednolite stany produktów pracy (ISO/IEC 29110: initiated, verified, approved).
# Brak pola status = rozpoczęty. Baseline nie jest stanem: wynika z tagów baseline-nn.
stany_produktow = ["rozpoczęty", "zweryfikowany", "zatwierdzony"]
# Produkty normy bez własnego typu elementów (D-12); pokazuje je slad.md.
iso_inne = ["WP.05 AGENTS.md", "WP.09 postep.md", "WP.11 repozytorium git", "WP.21 slad.md"]

[[typ]]
kod = "SC"
nazwa = "Scenka użytkownika"
wzorzec = "SC-\\d{2}"
plik = "scenki.md"
korzen = true
pokrycie = "UC:ostrzezenie"
produkt = true
iso = "WP.02"

[[typ]]
kod = "IO"
nazwa = "Pozycja zakresu In/Out"
wzorzec = "IO-\\d{2}"
plik = "zakres.md"
korzen = true
wymagane_pola = ["rodzaj"]
pokrycie = "UC:ostrzezenie"
warunek_pokrycia = "rodzaj=In"
produkt = true
iso = "WP.02"

[[typ]]
kod = "D"
nazwa = "Decyzja"
wzorzec = "D-\\d{2}"
plik = "decyzje.md"
korzen = true
wymagane_pola = ["status"]
statusy = ["otwarta", "rozstrzygnięta", "odłożona"]
pokrycie = "*:ostrzezenie"
warunek_pokrycia = "status=rozstrzygnięta"
iso = "WP.03, WP.07"

[[typ]]
kod = "K"
nazwa = "Temat w kolejce"
wzorzec = "K-\\d{2}"
plik = "decyzje.md"
korzen = true

[[typ]]
kod = "ZP"
nazwa = "Zasada projektowa"
wzorzec = "ZP-\\d{2}"
plik = "zasady.md"
pola = ["ustanawia"]
rodzice = ["D"]
pokrycie = "WYM:ostrzezenie"
produkt = true

[[typ]]
kod = "G"
nazwa = "Pojęcie słownika"
wzorzec = "G-[A-Z]{3}-\\d{2}"
plik = "slownik.md"
korzen = true
pola = ["zmienione przez"]
rodzice = ["D"]
pojecia = true
produkt = true
iso = "WP.13"

[[typ]]
kod = "UC"
nazwa = "Przypadek użycia"
wzorzec = "UC-\\d{2}"
plik = "przypadki-uzycia.md"
pola = ["scenki", "zakres"]
rodzice = ["SC", "IO"]
pokrycie = "WYM:ostrzezenie,E:ostrzezenie"
produkt = true
iso = "WP.13"

[[typ]]
kod = "RYZ"
nazwa = "Ryzyko"
wzorzec = "RYZ-\\d{2}"
plik = "ryzyka.md"
pola = ["źródło"]
rodzice = ["UC"]
pokrycie = "WYM:blad"
produkt = true

[[typ]]
kod = "WYM"
nazwa = "Wymaganie EARS"
wzorzec = "(?<![A-Z-])(?!(?:RYZ|CEL|ZAD|KOR|WER|WAL|AKC)-)[A-Z]{3}-\\d{2}"
plik = "wymagania.md"
pola = ["źródło"]
rodzice = ["UC", "D", "ZP", "RYZ", "IO"]
wymagane_pola = ["wzorzec", "tekst", "status"]
pokrycie = "AT:ostrzezenie"
ears = true
produkt = true
iso = "WP.13"

[[typ]]
kod = "E"
nazwa = "Ekran"
wzorzec = "E-\\d{2}"
plik = "nawigacja/ekrany.mmd"
format = "mermaid"
pola = ["realizuje"]
rodzice = ["UC"]
produkt = true
iso = "WP.16"

[[typ]]
kod = "AT"
nazwa = "Test akceptacyjny"
wzorzec = "AT-\\d{2}"
plik = "testy/*.feature"
format = "feature"
pola = ["weryfikuje"]
rodzice = ["WYM"]
produkt = true
iso = "WP.19"

# ---------- Plan (D-08, D-09): plan.md, ISO/IEC 29110 WP.10

[[typ]]
kod = "CEL"
nazwa = "Cel projektu"
wzorzec = "CEL-\\d{2}"
plik = "plan.md"
korzen = true
pokrycie = "KM:ostrzezenie"
iso = "WP.10"

[[typ]]
kod = "KM"
nazwa = "Kamień milowy"
wzorzec = "KM-\\d{2}"
plik = "plan.md"
pola = ["cel"]
rodzice = ["CEL"]
wymagane_pola = ["termin"]
pokrycie = "ZAD:ostrzezenie"
iso = "WP.10"

[[typ]]
kod = "ZAD"
nazwa = "Zadanie"
wzorzec = "ZAD-\\d{2}"
plik = "plan.md"
pola = ["kamień"]
rodzice = ["KM"]
wymagane_pola = ["status", "produkuje"]
statusy = ["planowane", "w toku", "zakończone"]
produkuje = true
iso = "WP.10"

[[typ]]
kod = "RP"
nazwa = "Ryzyko projektu"
wzorzec = "RP-\\d{2}"
plik = "plan.md"
korzen = true
pola = ["dotyczy"]
rodzice = ["CEL", "KM", "ZAD"]
wymagane_pola = ["status", "działanie"]
statusy = ["otwarte", "zamknięte"]
iso = "WP.10"

# ---------- Rekordy (D-12): rekordy.md

[[typ]]
kod = "KOR"
nazwa = "Korekta"
wzorzec = "KOR-\\d{2}"
plik = "rekordy.md"
pola = ["przyczyna"]
rodzice = ["ZAD", "KM", "RP", "WER", "WAL", "AKC"]
wymagane_pola = ["status", "działanie"]
statusy = ["rozpoczęta", "zatwierdzona", "zakończona"]
iso = "WP.04"

[[typ]]
kod = "WER"
nazwa = "Weryfikacja"
wzorzec = "WER-\\d{2}"
plik = "rekordy.md"
pola = ["obiekt"]
rodzice = ["SC", "IO", "ZP", "G", "UC", "RYZ", "WYM", "E", "AT", "CEL", "KM", "ZAD"]
wymagane_pola = ["data", "wynik"]
wyniki = ["zgodny", "niezgodny"]
pokrycie = "KOR:ostrzezenie"
warunek_pokrycia = "wynik=niezgodny"
iso = "WP.23"

[[typ]]
kod = "WAL"
nazwa = "Walidacja"
wzorzec = "WAL-\\d{2}"
plik = "rekordy.md"
pola = ["obiekt"]
rodzice = ["SC", "UC", "WYM", "E", "AT"]
wymagane_pola = ["data", "wynik"]
wyniki = ["zgodny", "niezgodny"]
pokrycie = "KOR:ostrzezenie"
warunek_pokrycia = "wynik=niezgodny"
iso = "WP.22"

[[typ]]
kod = "AKC"
nazwa = "Akceptacja"
wzorzec = "AKC-\\d{2}"
plik = "rekordy.md"
pola = ["kamień"]
rodzice = ["KM"]
wymagane_pola = ["data", "wynik"]
wyniki = ["przyjęty", "odrzucony"]
pokrycie = "KOR:ostrzezenie"
warunek_pokrycia = "wynik=odrzucony"
iso = "WP.01"
